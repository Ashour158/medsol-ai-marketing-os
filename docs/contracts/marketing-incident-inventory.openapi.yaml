openapi: 3.1.0
info:
  title: Medsol Marketing OS incident inventory (subset contract)
  version: 0.3.1
  description: >
    Documented HTTP subset for the existing incident read model; not a generated
    description of the entire Marketing OS API.
paths:
  /marketing/command-center/incidents/{kind}:
    get:
      operationId: listMarketingIncidents
      summary: Read tenant-scoped incidents without modifying business state
      description: >
        Requires verified OIDC identity, active server session, and READ_AUDIT
        manager authority. A bootstrap token cannot access this route.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [BRAIN_NEEDS_INTERVENTION, BRAIN_STALE, OUTBOX_DEAD_LETTER]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          description: >
            Opaque stable record ID; must still match the incident predicate and tenant.
            An invalidated cursor returns 400 and the client should restart pagination.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,128}$'
        - name: x-marketing-session-id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current observed inventory (not a transactional snapshot)
          content:
            application/json:
              schema:
                type: object
                required: [kind, total, incidents, nextCursor]
                properties:
                  kind:
                    type: string
                  total:
                    type: integer
                    minimum: 0
                  incidents:
                    type: array
                    items:
                      type: object
                      required: [id, kind, severity, runId, updatedAt, message]
                      properties:
                        id: { type: string }
                        kind: { type: string }
                        severity: { type: string, enum: [CRITICAL, WARNING] }
                        runId: { type: [string, 'null'] }
                        updatedAt: { type: [string, 'null'], format: date-time }
                        message: { type: string }
                  nextCursor:
                    type: [string, 'null']
        '400':
          description: Unsupported kind, malformed limit/cursor or invalidated cursor
        '401':
          description: Missing or expired identity/server session
        '403':
          description: Insufficient marketing audit authority or tenant mismatch
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
