name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketing_test
          POSTGRES_PASSWORD: marketing_test_password
          POSTGRES_DB: marketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketing_test -d marketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://marketing_test:marketing_test_password@localhost:5432/marketing_test?schema=public
      MARKETING_DB_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema prisma/schema.prisma
      - name: Inspect historical baseline SQL (temporary migration repair probe)
        run: |
          git show ee4d6513422bea8ffd0e7e3e1ebf070fc502f971:prisma/schema.prisma > /tmp/marketing-baseline-compact.prisma
          python3 - <<'PY'
          import re
          from pathlib import Path
          source=Path('/tmp/marketing-baseline-compact.prisma').read_text()
          out=[]
          for line in source.splitlines():
              if line.startswith('generator '):
                  out.append('generator client {\n  provider = "prisma-client-js"\n}')
              elif line.startswith('datasource '):
                  out.append('datasource db {\n  provider = "postgresql"\n  url = env("DATABASE_URL")\n}')
              elif line.startswith('enum '):
                  match=re.fullmatch(r'enum (\w+) \{ (.*) \}',line)
                  if not match: raise RuntimeError('Unexpected enum schema')
                  name,values=match.groups()
                  out.append('enum '+name+' {\n  '+'\n  '.join(values.split())+'\n}')
              elif line.startswith('model '):
                  match=re.fullmatch(r'model (\w+) \{ (.*) \}',line)
                  if not match: raise RuntimeError('Unexpected model schema')
                  name,fields=match.groups()
                  out.append('model '+name+' {\n  '+'\n  '.join(value.strip() for value in fields.split(';') if value.strip())+'\n}')
              else: raise RuntimeError('Unknown historical schema syntax')
          Path('/tmp/marketing-baseline.prisma').write_text('\n\n'.join(out)+'\n')
          PY
          pnpm exec prisma migrate diff --from-empty --to-schema-datamodel /tmp/marketing-baseline.prisma --script > /tmp/marketing-baseline.sql
          echo 'BEGIN_MARKETING_BASELINE_SQL'
          cat /tmp/marketing-baseline.sql
          echo 'END_MARKETING_BASELINE_SQL'
      - name: Build workspace libraries
        run: pnpm --filter './packages/**' build
      - name: Typecheck
        run: pnpm typecheck
      - name: Prepare isolated PostgreSQL integration schema
        run: pnpm exec prisma db push --schema prisma/schema.prisma --skip-generate
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
