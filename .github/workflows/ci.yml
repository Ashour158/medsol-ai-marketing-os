name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alpha-lock:
    name: Exact reviewed Alpha dependency candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Recover reviewed lockfile if not yet committed
        if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
        uses: actions/download-artifact@v4
        with:
          name: medsol-alpha-packaging-45901525897
          run-id: 45901525897
          github-token: ${{ github.token }}
          path: .alpha-reviewed-lock
      - name: Verify exact reviewed dependency resolution
        run: |
          if ! test -f pnpm-lock.yaml; then
            cp .alpha-reviewed-lock/pnpm-lock.yaml pnpm-lock.yaml
            printf '%s  %s\n' 'a7b6c375be4e2e73443db4edcb94c2eae227e3ce92fa62bcb9aa5f1014d2b445' pnpm-lock.yaml | sha256sum -c -
          fi
          sha256sum pnpm-lock.yaml > alpha-lockfile.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: medsol-alpha-reviewed-lock-${{ github.run_id }}
          path: |
            pnpm-lock.yaml
            alpha-lockfile.sha256
          if-no-files-found: error
          retention-days: 30
  verify:
    name: verify
    needs: alpha-lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketing_test
          POSTGRES_PASSWORD: marketing_test_password
          POSTGRES_DB: marketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketing_test -d marketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://marketing_test:marketing_test_password@localhost:5432/marketing_test?schema=public
      MARKETING_DB_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load same-run reviewed lockfile
        uses: actions/download-artifact@v4
        with:
          name: medsol-alpha-reviewed-lock-${{ github.run_id }}
          path: .
      - name: Verify dependency candidate hash
        run: sha256sum -c alpha-lockfile.sha256
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check free GitHub Codespaces offline port and manual CI policies
        run: node --test scripts/quality/t7c-free-github.nodecheck.mjs
      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema prisma/schema.prisma
      - name: Build workspace libraries
        run: pnpm --filter './packages/**' build
      - name: Typecheck
        run: pnpm typecheck
      - name: Apply actual PostgreSQL migrations to clean integration database
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Verify migrated database matches Prisma schema
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Rehearse non-destructive upgrade from historical database baseline
        run: |
          export PGPASSWORD=marketing_test_password
          createdb -h localhost -p 5432 -U marketing_test marketing_upgrade_test
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U marketing_test -d marketing_upgrade_test -f prisma/migrations/20261117000000_initial_marketing_schema/migration.sql
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U marketing_test -d marketing_upgrade_test -c "INSERT INTO \"Organization\" (\"id\",\"name\",\"createdAt\",\"updatedAt\") VALUES ('upgrade-tenant','Historical tenant',now(),now());"
          export DATABASE_URL="postgresql://marketing_test:marketing_test_password@localhost:5432/marketing_upgrade_test?schema=public"
          pnpm exec prisma migrate resolve --applied 20261117000000_initial_marketing_schema --schema prisma/schema.prisma
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          test "$(psql -h localhost -p 5432 -U marketing_test -d marketing_upgrade_test -Atc "SELECT count(*) FROM \"Organization\" WHERE \"id\"='upgrade-tenant' AND \"name\"='Historical tenant';")" = "1"
      - name: Test
        run: pnpm test
      - name: Audit all 50 tenant-owned PostgreSQL tables for FORCE RLS (zero uncovered allowed)
        env:
          MARKETING_R3N_RLS_CI_ONLY: '1'
        run: node scripts/quality/r3n-tenant-rls-inventory.mjs --output r3n-rls-inventory.json
      - name: Upload R3-N database RLS inventory and explicit uncovered-table backlog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-r3n-tenant-rls-inventory-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: r3n-rls-inventory.json
      - name: Reject unsafe disposable staging configuration and spoofed offline safety proofs
        run: node --test scripts/quality/r3x-staging-preflight.test.mjs
      - name: Require same-run FORCE RLS census and no real provider access for R3-X staging
        env:
          MARKETING_R3X_PREFLIGHT_CI_ONLY: '1'
        run: node scripts/quality/r3x-staging-preflight.mjs --output r3x-staging-preflight.json
      - name: Run isolated R3-X actual PostgreSQL two-tenant cross-engine acceptance
        run: pnpm --filter @medsol/api exec vitest run src/postgres-r3x-cross-engine-staging.integration.test.ts --reporter=json --outputFile=../../r3x-postgres-test-results.json
      - name: Test strict real PostgreSQL execution report binding and forgery denial
        run: node --test scripts/quality/r3x-postgres-evidence.test.mjs
      - name: Issue R3-X same-run 37-case real PostgreSQL execution manifest
        run: node scripts/quality/r3x-postgres-evidence.mjs --input r3x-postgres-test-results.json --output r3x-postgres-evidence.json
      - name: Preserve R3-X staging preflight and real PostgreSQL execution proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-r3x-offline-staging-postgres-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            r3x-staging-preflight.json
            r3x-postgres-test-results.json
            r3x-postgres-evidence.json
      - name: Build production Next frontend for real-browser acceptance
        run: pnpm --filter @medsol/web build
      - name: Install Chromium for R3-W browser fault and role acceptance
        run: pnpm --filter @medsol/web exec playwright install --with-deps chromium
      - name: Run 51 Chromium browser journeys with local-only synthetic API and encrypted session
        run: pnpm --filter @medsol/web test:browser
      - name: Preserve R3-W Chromium browser traces, JSON evidence and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-r3w-chromium-browser-report-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
      - name: Reject forged, skipped, flaky, retried or missing Chromium execution results
        run: node --test scripts/quality/r3w-browser-evidence.test.mjs
      - name: Generate same-run actual Chromium execution manifest from Playwright JSON
        run: node scripts/quality/r3w-browser-evidence.mjs --input apps/web/playwright-report/r3w-results.json --output r3w-browser-evidence.json
      - name: Build compiled Nest API for real-stack staging acceptance
        run: pnpm --filter @medsol/api build
      - name: Prepare TLS-only local JWKS, disposable identities and NON-BYPASSRLS runtime database role
        env:
          MARKETING_R3Y_STAGING_CI_ONLY: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/medsol-r3y-jwks
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/medsol-r3y-jwks/key.pem -out /tmp/medsol-r3y-jwks/cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          chmod 600 /tmp/medsol-r3y-jwks/key.pem
          export PGPASSWORD=marketing_test_password
          psql -X -v ON_ERROR_STOP=1 -h localhost -p 5432 -U marketing_test -d marketing_test <<'SQL'
          CREATE ROLE marketing_r3y_runtime LOGIN PASSWORD 'r3y_disposable_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE marketing_test TO marketing_r3y_runtime;
          GRANT USAGE ON SCHEMA public TO marketing_r3y_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO marketing_r3y_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO marketing_r3y_runtime;
          SQL
          node apps/api/e2e/fixtures/r3y-seed.mjs
      - name: Prove runtime PostgreSQL application user has no bypass role and real per-tenant RLS
        env:
          MARKETING_R3Y_STAGING_CI_ONLY: '1'
          DATABASE_URL: postgresql://marketing_r3y_runtime:r3y_disposable_password@localhost:5432/marketing_test?schema=public
        run: node scripts/quality/r3y-runtime-role-proof.mjs --output r3y-runtime-role-evidence.json
      - name: Run 19 Chromium cases with compiled Nest API, PostgreSQL, signed loopback JWKS and production-built Next
        run: pnpm --filter @medsol/web exec playwright test --config playwright.staging.config.ts
      - name: Run T1D interactive signed-OIDC browser login with real Nest and PostgreSQL (disposable only)
        run: pnpm --filter @medsol/web exec playwright test --config playwright.disposable-oidc.config.ts
      - name: Preserve T1D synthetic OIDC login traces (not independently certified)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-t1d-disposable-browser-login-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/web/t1d-playwright-report/
            apps/web/t1d-test-results/
      - name: Verify R3-Y actual real-stack browser report and local signed-OIDC provenance
        run: node --test scripts/quality/r3y-real-stack-evidence.test.mjs
      - name: Bind R3-Y real browser passes to same-run non-bypass RLS and no-provider preflight
        run: node scripts/quality/r3y-real-stack-evidence.mjs --input apps/web/r3y-playwright-report/r3y-results.json --output r3y-real-stack-evidence.json
      - name: Enforce operator staging PostgreSQL TLS and routing negative regression corpus
        run: node --test apps/api/scripts/t1g-staging-db-policy.nodecheck.mjs
      - name: Validate T1E staging configuration and dry-run operator provisioning with no external contact
        env:
          MARKETING_R3Y_STAGING_CI_ONLY: '1'
          MARKETING_DISPOSABLE_OIDC_CI_ONLY: '1'
          MARKETING_T1E_STAGING_CI_ONLY: '1'
          MARKETING_DEPLOYMENT_ENV: staging
          MARKETING_IDENTITY_PROVIDER: STAGING_OIDC
          MARKETING_STAGING_OIDC_ENABLED: OFFLINE_OPERATOR_TEST_ONLY
          MARKETING_AUTH_MODE: oidc
          MARKETING_TENANT_RESOLUTION_MODE: SIGNED_OIDC_CLAIM
          MARKETING_EXTERNAL_EFFECTS_ENABLED: 'false'
          MARKETING_AI_REASONING_ENABLED: 'false'
          MARKETING_REAL_EMAIL_ENABLED: 'false'
          MARKETING_OIDC_ISSUER: https://127.0.0.1:3215
          MARKETING_STAGING_OIDC_TRUSTED_ISSUER: https://127.0.0.1:3215
          MARKETING_OIDC_JWKS_URL: https://127.0.0.1:3215/.well-known/jwks.json
          MARKETING_OIDC_CLIENT_ID: r3y-disposable-browser
          MARKETING_OIDC_AUDIENCE: api://medsol-r3y
          MARKETING_STAGING_OIDC_CLIENT_SECRET: r3y-disposable-client-secret-ci-only
          MARKETING_PUBLIC_ORIGIN: https://127.0.0.1:3443
          MARKETING_API_INTERNAL_URL: http://127.0.0.1:3210
        run: |
          export MARKETING_SESSION_SECRET="$(node -p "require('node:crypto').randomBytes(32).toString('base64url')")"
          node apps/api/scripts/t1e-staging-preflight.mjs --output t1e-staging-config-evidence.json
          node apps/api/scripts/t1e-provision-operator.mjs --tenant r3y-tenant-a --subject ci-opaque-operator --name CiOperator --email ci-test@example.invalid --role VIEWER > t1e-provision-dryrun.json
      - name: Preserve T1E configuration preflight and read-only operator provision proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-t1e-staging-config-preflight-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            t1e-staging-config-evidence.json
            t1e-provision-dryrun.json
      - name: Provision additional CI-only T1E operator identities in canonical User table
        env:
          MARKETING_R3Y_STAGING_CI_ONLY: '1'
          MARKETING_T1E_STAGING_CI_ONLY: '1'
        run: node apps/api/e2e/fixtures/t1e-staging-operator-seed.mjs
      - name: Run T1E self-hosted OIDC policy with real Chromium, Nest API and PostgreSQL
        run: pnpm --filter @medsol/web exec playwright test --config playwright.operator-staging.config.ts
      - name: Preserve T1E operator staging browser evidence (disposable, unsigned)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-t1e-operator-staging-browser-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/web/t1e-playwright-report/
            apps/web/t1e-test-results/
      - name: Reject forged, skipped or unproven T1F signed operator browser evidence
        run: node --test scripts/quality/t1f-signed-operator-evidence.test.mjs
      - name: Run T1F five signed-operator end-to-end browser journeys through actual Nest and PostgreSQL
        run: pnpm --filter @medsol/web exec playwright test --config playwright.operator-full-journey.config.ts
      - name: Bind T1F Chromium cases to real same-run RLS, offline identity and zero-provider preflight
        env:
          MARKETING_T1F_EVIDENCE_CI_ONLY: '1'
        run: node scripts/quality/t1f-signed-operator-evidence.mjs --input apps/web/t1f-playwright-report/t1f-results.json --output t1f-signed-operator-evidence.json
      - name: Preserve T1F actual browser and noncertifying operator-journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-t1f-signed-operator-journey-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            apps/web/t1f-playwright-report/
            apps/web/t1f-test-results/
            t1f-signed-operator-evidence.json
      - name: Create throwaway Ed25519 DAG signer for T3C offline operator browser acceptance
        run: |
          set -euo pipefail
          openssl genpkey -algorithm ED25519 -out /tmp/medsol-r3y-jwks/t3c-dag-private.pem
          chmod 600 /tmp/medsol-r3y-jwks/t3c-dag-private.pem
          openssl pkey -in /tmp/medsol-r3y-jwks/t3c-dag-private.pem -pubout -out /tmp/medsol-r3y-jwks/t3c-dag-public.pem
      - name: Test T3C browser evidence verification rejection paths
        run: node --test scripts/quality/t3c-offline-dag-evidence.test.mjs
      - name: Run T3C real-stack signed offline DAG maker-checker operator journeys
        env:
          MARKETING_R3Y_STAGING_CI_ONLY: '1'
        run: pnpm --filter @medsol/web exec playwright test --config playwright.offline-dag-operator.config.ts
      - name: Record T3C runtime-bound signed-DAG browser evidence
        env:
          MARKETING_T3C_EVIDENCE_CI_ONLY: '1'
        run: node scripts/quality/t3c-offline-dag-evidence.mjs --input apps/web/t3c-playwright-report/t3c-results.json --output t3c-dag-evidence.json
      - name: Preserve T3C actual browser runs (engineering only, no independent QA claim)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-t3c-offline-dag-operator-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/web/t3c-playwright-report/
            apps/web/t3c-test-results/
            t3c-dag-evidence.json
      - name: Create disposable CI-only Ed25519 signer for T3D reviewed knowledge DAG
        run: |
          set -euo pipefail
          openssl genpkey -algorithm ED25519 -out /tmp/medsol-r3y-jwks/t3d-dag-private.pem
          chmod 600 /tmp/medsol-r3y-jwks/t3d-dag-private.pem
          openssl pkey -in /tmp/medsol-r3y-jwks/t3d-dag-private.pem -pubout -out /tmp/medsol-r3y-jwks/t3d-dag-public.pem
      - name: Verify T3D evidence validator rejects forged and missing Chromium execution
        run: node --test scripts/quality/t3d-knowledge-dag-evidence.test.mjs
      - name: Test T3D signed offline reviewed knowledge and revocation on real Next Nest PostgreSQL
        env:
          MARKETING_R3Y_STAGING_CI_ONLY: '1'
        run: pnpm --filter @medsol/web exec playwright test --config playwright.t3d-knowledge.config.ts
      - name: Record T3D real signed knowledge DAG CI evidence against same-run security checks
        env:
          MARKETING_T3D_EVIDENCE_CI_ONLY: '1'
        run: node scripts/quality/t3d-knowledge-dag-evidence.mjs --input apps/web/t3d-playwright-report/t3d-results.json --output t3d-knowledge-dag-evidence.json
      - name: Preserve T3D reviewed knowledge and revocation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-t3d-signed-knowledge-dag-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/web/t3d-playwright-report/
            apps/web/t3d-test-results/
            t3d-knowledge-dag-evidence.json
      - name: Verify T4A signed offline creative browser evidence rejects missing or forged execution
        run: node --test scripts/quality/t4a-creative-evidence.test.mjs
      - name: Run T4A real-stack offline creative editing and cross-tenant Chromium acceptance
        env:
          MARKETING_R3Y_STAGING_CI_ONLY: '1'
        run: pnpm --filter @medsol/web exec playwright test --config playwright.t4a-creative.config.ts
      - name: Bind T4A creative editor browser outcomes to same-run RLS and no-egress identity
        env:
          MARKETING_T4A_EVIDENCE_CI_ONLY: '1'
        run: node scripts/quality/t4a-creative-evidence.mjs --input apps/web/t4a-playwright-report/t4a-results.json --output t4a-creative-evidence.json
      - name: Preserve T4A offline revision editor and authorized browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-t4a-creative-iteration-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/web/t4a-playwright-report/
            apps/web/t4a-test-results/
            t4a-creative-evidence.json
      - name: Upload R3-Y real-stack Chromium traces, role proof and non-certifying manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-r3y-real-stack-staging-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            apps/web/r3y-playwright-report/
            apps/web/r3y-test-results/
            r3y-runtime-role-evidence.json
            r3y-real-stack-evidence.json
      - name: Validate 284 mapped engineering assertions in strict 500-case blueprint (NOT independently signed 500 E2E)
        env:
          MARKETING_R3U_TEST_GATE_PASSED: 'true'
          MARKETING_R3V_BROWSER_GATE_PASSED: 'true'
          MARKETING_R3W_BROWSER_GATE_PASSED: 'true'
          MARKETING_R3X_POSTGRES_GATE_PASSED: 'true'
          MARKETING_R3Y_REAL_STACK_GATE_PASSED: 'true'
        run: node scripts/quality/r3l-acceptance-case-index.mjs --output r3y-real-stack-acceptance-evidence.json
      - name: Verify canonical 500-case operator packets reject fabricated signoffs
        run: node --test scripts/quality/independent-qa-packets.test.mjs
      - name: Generate ten unsigned 50-case independent operator packets (NOT executed)
        run: node scripts/quality/independent-qa-packets.mjs --index r3y-real-stack-acceptance-evidence.json --output-dir independent-qa-operator-packets
      - name: Upload unexecuted independent operator work packets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-unsigned-operator-packets-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: independent-qa-operator-packets/
      - name: Reject forged independent QA handoff and incomplete 500-case proof
        run: node --test scripts/quality/r3y-operator-handoff.test.mjs
      - name: Generate 500-slot independent operator handoff with zero forged signatures
        run: node scripts/quality/r3y-operator-handoff.mjs --input r3y-real-stack-acceptance-evidence.json --output r3y-operator-handoff.json
      - name: Reject fabricated, cross-run or incorrectly certified sprint evidence
        run: node --test scripts/quality/t4b-sprint-engineering-evidence.nodecheck.mjs
      - name: Assemble same-run non-certifying seven-day engineering handoff
        env:
          MARKETING_T4B_EVIDENCE_CI_ONLY: '1'
        run: node scripts/quality/t4b-sprint-engineering-evidence.mjs --output t4b-seven-day-engineering-handoff.json
      - name: Preserve actual CI engineering handoff (NOT independent staging or production QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-t4b-seven-day-engineering-handoff-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: t4b-seven-day-engineering-handoff.json
      - name: Upload unsigned independent staging QA handoff for future operator use
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-r3y-unsigned-operator-handoff-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: r3y-operator-handoff.json
      - name: Upload R3-Y real-stack CI-only, non-certifying 500-case evidence coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-r3y-real-stack-acceptance-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: r3y-real-stack-acceptance-evidence.json
      - name: Upload actual per-case Playwright execution manifest (non-certifying)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-r3w-chromium-runtime-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: r3w-browser-evidence.json
      - name: Reject forged production certification and fake independent 500-case signatures
        run: node --test scripts/quality/production-release-certification.test.mjs
      - name: Disposable PostgreSQL backup and restore rehearsal (not production DR certification)
        env:
          MARKETING_DR_CI_ONLY: '1'
        run: node scripts/quality/r3k-offline-dr-rehearsal.mjs
      - name: Upload verified disposable DR evidence (never raw database backups)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-r3k-offline-dr-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: r3k-dr-evidence.json
      - name: Validate maintainer PR review reference policy
        run: node --test scripts/quality/pr-review-salvage-policy.test.mjs
      - name: Verify repository-wide ECC evidence manifest (not a GitHub App check)
        run: |
          node --test scripts/quality/ecc-repository-readiness.test.mjs
          node scripts/quality/ecc-repository-readiness.mjs --output ecc-reference-readiness.json
      - name: Upload verified reference index (not product or security certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-repository-reference-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: ecc-reference-readiness.json
      - name: Build
        run: pnpm build

  security-evidence:
    name: dependency audit and SBOM evidence
    needs: alpha-lock
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load same-run reviewed lockfile
        uses: actions/download-artifact@v4
        with:
          name: medsol-alpha-reviewed-lock-${{ github.run_id }}
          path: .
      - name: Verify dependency candidate hash
        run: sha256sum -c alpha-lockfile.sha256
      - name: Install dependencies for security inspection
        run: pnpm install --frozen-lockfile
      - name: Generate SPDX software bill of materials
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Record real dependency audit output and exit code
        if: always()
        shell: bash
        run: |
          set +e
          pnpm audit --json > dependency-audit.json 2> dependency-audit.stderr
          status=$?
          printf '%s\n' "$status" > dependency-audit.exitcode
          printf 'Dependency audit exit code: %s\n' "$status"
          exit 0
      - name: Upload scanner evidence for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-security-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            sbom.spdx.json
            dependency-audit.json
            dependency-audit.stderr
            dependency-audit.exitcode

      - name: Block Alpha candidate on high or critical audit findings or missing scanner evidence
        if: always()
        run: |
          node --test scripts/quality/alpha-dependency-gate.test.mjs
          node scripts/quality/alpha-dependency-gate.mjs

  alpha-packaging:
    name: Alpha offline image packaging rehearsal
    needs: alpha-lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load same-run reviewed lockfile
        uses: actions/download-artifact@v4
        with:
          name: medsol-alpha-reviewed-lock-${{ github.run_id }}
          path: .
      - name: Verify dependency candidate hash
        run: sha256sum -c alpha-lockfile.sha256
      - name: Build local API and web images with immutable base
        run: |
          base='node@sha256:be979e5523c76fa4d5ca4ebd3099078f220aa47ec39c48ad5b5df9314debd6eb'
          docker pull "$base"
          [[ "$base" =~ @sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$base" > alpha-base-image.txt
          for target in api web; do
            docker build --file infra/staging/Dockerfile --build-arg "NODE_IMAGE=$base" --target "$target" --tag "medsol-alpha-$target:ci" .
            docker image inspect "medsol-alpha-$target:ci" --format '{{.Id}} {{.Config.User}}' > "alpha-$target-image.txt"
            test "$(docker image inspect "medsol-alpha-$target:ci" --format '{{.Config.User}}')" = node
          done
      - name: Verify compiled artifacts with zero container network
        run: |
          docker run --rm --network none --read-only --entrypoint node medsol-alpha-api:ci -e "const fs=require('node:fs'); if(process.getuid()===0||!fs.existsSync('dist/main.js')||!require.resolve('@prisma/client')||process.env.MARKETING_EXTERNAL_EFFECTS_ENABLED!=='false')process.exit(1)"
          docker run --rm --network none --read-only --entrypoint node medsol-alpha-web:ci -e "const fs=require('node:fs'); if(process.getuid()===0||!fs.existsSync('.next/BUILD_ID')||!require.resolve('next')||process.env.MARKETING_REAL_EMAIL_ENABLED!=='false')process.exit(1)"
          printf '%s\n' 'PACKAGING_ONLY_NOT_DEPLOYED_NOT_CERTIFIED' > alpha-packaging-status.txt
      - name: Rehearse actual packaged application startup and durable volume replacement
        run: bash infra/staging/alpha-container-rehearsal.sh
      - name: Preserve local build provenance and candidate lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsol-alpha-packaging-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            pnpm-lock.yaml
            alpha-lockfile.sha256
            alpha-base-image.txt
            alpha-api-image.txt
            alpha-web-image.txt
            alpha-packaging-status.txt
            alpha-container-rehearsal-status.txt
            alpha-postgres-image.txt
